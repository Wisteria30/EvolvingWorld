# ==============================================================
# EvolvingWorld Training Configuration
# ==============================================================
# This config controls data preparation and LLaMA-Factory training.
# Modify parameters below to switch between training modes.

# ==============================================================
# Section 1: Data Preparation Settings
# ==============================================================

# Which models to prepare data for (model_a: director, model_b: actor)
models:
  - model_a
  - model_b

# Data mixing mode: "balanced" | "full" | "custom"
#   balanced: equal ratio across tasks (min task size)
#   full:     use all available data
#   custom:   user-defined ratios (see custom_ratios below)
mode: full

# Source data directory (sharegpt files from transform.py)
data_dir: dataset/train

# Output directory for prepared training data
data_output_dir: training/prepared_data

# Random seed for reproducibility
seed: 42

# ------ Tulu3 General Domain Mixing ------
# Path to tulu3 general-domain SFT data (sharegpt format, .json or .jsonl)
# Set to null to disable mixing
# Download from: https://huggingface.co/datasets/allenai/tulu-3-sft-mixture
tulu3_path: dataset/tulu3_sft_sharegpt.json   # downloaded via training/download_tulu3.py

# Ratio of tulu3 data relative to domain-specific data
# 1.0 = equal amount, 0.5 = half, 0.0 = no mixing
tulu3_ratio: 1.0

# ------ Custom Ratios (only used when mode=custom) ------
# Define per-task ratios for each model.
# Ratios are relative weights, not absolute counts.
# The constraining task (smallest data/ratio) determines the base.
custom_ratios:
  model_a:
    scene_cast: 1.0
    location_scenario: 1.0
    next_character: 1.0
    world_update: 1.0
  model_b:
    interaction_gen: 1.0
    character_update: 1.0
    motivation_update: 1.0


# ==============================================================
# Section 2: LLaMA-Factory Training Hyperparameters
# ==============================================================

# ------ Model Settings ------
model_name_or_path: meta-llama/Llama-3.1-8B-Instruct   # base model
# model_name_or_path: Qwen/Qwen2.5-7B-Instruct         # alternative

# ------ Training Method ------
stage: sft                    # supervised fine-tuning
finetuning_type: lora         # lora | full | freeze
lora_rank: 64                 # LoRA rank (8, 16, 32, 64, 128)
lora_alpha: 128               # LoRA alpha (typically 2x rank)
lora_dropout: 0.05            # LoRA dropout
lora_target: all              # target modules ("all" for all linear layers)

# ------ Dataset ------
# dataset name in dataset_info.json (will be auto-generated by prepare_data.py)
# Format: evolvingworld_{model_name}
# For model_a: evolvingworld_model_a
# For model_b: evolvingworld_model_b
template: llama3              # chat template (llama3 | qwen | chatml)
# template: qwen               # for Qwen models
cutoff_len: 32768             # max sequence length (covers nearly all data including scene_cast/location_scenario)
packing: true                 # pack multiple short samples into one sequence to avoid padding waste
preprocessing_num_workers: 16

# ------ Training Hyperparameters ------
num_train_epochs: 2         # number of training epochs
per_device_train_batch_size: 1
gradient_accumulation_steps: 64  # effective batch size = per_device * grad_accum * num_gpus
learning_rate: 2.0e-5         # peak learning rate
lr_scheduler_type: cosine     # cosine | linear | constant
warmup_ratio: 0.1             # warmup steps as ratio of total steps
weight_decay: 0.01
max_grad_norm: 1.0

# ------ Memory & Speed Optimization ------
bf16: true                    # use bf16 mixed precision
gradient_checkpointing: true  # trade compute for memory
flash_attn: fa2               # flash attention 2 (auto | fa2 | disabled)
deepspeed: null               # deepspeed config file (null for single-GPU or FSDP)
# deepspeed: training/ds_z2_config.json  # for multi-GPU with ZeRO-2
# deepspeed: training/ds_z3_config.json  # for multi-GPU with ZeRO-3

# ------ Logging & Saving ------
logging_steps: 20
save_steps: 100
save_total_limit: null        # null means keep all checkpoints
train_output_dir: null        # output root for checkpoints; null defaults to training/outputs
report_to: none               # tensorboard | wandb | none

# ------ Evaluation ------
do_eval: true                 # automatically evaluate using the held-out split
eval_holdout_ratio: 0.1       # hold out this fraction of merged data as eval when do_eval=true
eval_strategy: "steps"        # no | steps | epoch
eval_steps: 50
eval_on_each_task: true       # evaluate on each task-specific eval split
per_device_eval_batch_size: 2

# ------ FSDP (alternative to DeepSpeed for multi-GPU) ------
# fsdp: "full_shard auto_wrap"
# fsdp_config:
#   fsdp_transformer_layer_cls_to_wrap: LlamaDecoderLayer
